<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="identifiant"></div>
    <dialog id="apparition">
            <form id="formulaire">
                <div class="champ">
                    <div>
                        <label for="titre" >title</label>
                        <input id="titre" type="text" placeholder="20 milles lieux sous la mer">
                    </div>
                    <div>
                        <label for="auteur" >author</label>
                        <input id="auteur" type="text" placeholder="jule verne">
                    </div>
                    <div>
                        <label for="page" >page</label>
                        <input id="page" type="number" placeholder="500">
                    </div>
                    <div>
                        <label for="etat">Read</label>
                        <input id="etat" type="checkbox">
                    </div>
                    <button type="submit"> Enregistrer</button>
                </div>
            </form>
    </dialog>
    <button id="bouton">New Book</button>
    <script src="js/script.js"></script>
</body>
</html>
